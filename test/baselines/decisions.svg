s .node circle,#baseline-decisions .node ellipse,#baseline-decisions .node polygon,#baseline-decisions .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#baseline-decisions .rough-node .label text,#baseline-decisions .node .label text,#baseline-decisions .image-shape .label,#baseline-decisions .icon-shape .label{text-anchor:middle;}#baseline-decisions .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#baseline-decisions .rough-node .label,#baseline-decisions .node .label,#baseline-decisions .image-shape .label,#baseline-decisions .icon-shape .label{text-align:center;}#baseline-decisions .node.clickable{cursor:pointer;}#baseline-decisions .root .anchor path{fill:#333333!important;stroke-width:0;stroke:#333333;}#baseline-decisions .arrowheadPath{fill:#333333;}#baseline-decisions .edgePaths .path{stroke:#333333;stroke-width:1px;}#baseline-decisions .flowchart-link{stroke:#333333;fill:none;}#baseline-decisions .edgeLabel{background-color:rgba(232,232,232, 0.8);text-align:center;}#baseline-decisions .edgeLabel p{background-color:rgba(232,232,232, 0.8);}#baseline-decisions .edgeLabel rect{opacity:0.5;background-color:rgba(232,232,232, 0.8);fill:rgba(232,232,232, 0.8);}#baseline-decisions .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#baseline-decisions .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#baseline-decisions .cluster text{fill:#333;}#baseline-decisions .cluster span{color:#333;}#baseline-decisions .node .collapsed-indicator{fill:#aaaa33;stroke:none;opacity:0.6;}#baseline-decisions .node .collapsed-separator{stroke:#aaaa33;stroke-width:0.75px;}#baseline-decisions div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:TraceBaseline;font-size:12px;background:hsl(80, 100%, 96.2745098039%);border:1px solid #aaaa33;border-radius:2px;pointer-events:none;z-index:100;}#baseline-decisions .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#333;}#baseline-decisions rect.text{fill:none;stroke