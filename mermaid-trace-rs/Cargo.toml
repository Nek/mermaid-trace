[package]
name = "mermaid-trace-rs"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
merman = { path = "vendor/merman/crates/merman", default-features = false, features = ["svg", "layout-elk", "math"] }
serde_json = "1.0"
roxmltree = "0.21"

merman-render = { path = "vendor/merman/crates/merman-render" }
merman-export = { path = "vendor/merman/crates/merman-export", features = ["text"] }

# Cargo patches must be declared by the consuming workspace too.
[patch.crates-io]
usvg = { git = "https://github.com/Nek/resvg.git", rev = "cf6e6b61e952b9e42fd8d3aa11723c44edd15fcd" }
